[package]
name = "rust-loadbench"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset", "http2", "system-proxy"] }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.27.0", features = ["v4"] }
